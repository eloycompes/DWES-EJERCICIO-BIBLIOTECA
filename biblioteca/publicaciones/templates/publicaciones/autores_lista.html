{% extends 'publicaciones/base.html' %}

{% block title %}Lista de Autores{% endblock %}

{% block content %}
    <h2>Lista de Autores</h2>
    <ul>
        {% for autor in autores %}
            <li>{{ autor.nombre }} {{ autor.apellidos }}</li>
        {% empty %}
            <li>No hay autores disponibles.</li>
        {% endfor %}
    </ul>
{% endblock %}
